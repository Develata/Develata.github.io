name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Cold Rust output depends only on this game's source and tooling.
      # Warm site / hot news changes reuse it without setting up Rust.
      - name: Restore Northern Run WASM
        id: northern-wasm
        uses: actions/cache@v4
        with:
          path: docs/public/game-assets/qin-polar-run/wasm
          key: northern-run-wasm-v1-${{ runner.os }}-${{ hashFiles('docs/.vitepress/theme/components/games/qin-polar-run/rust/Cargo.toml', 'docs/.vitepress/theme/components/games/qin-polar-run/rust/Cargo.lock', 'docs/.vitepress/theme/components/games/qin-polar-run/rust/rust-toolchain.toml', 'docs/.vitepress/theme/components/games/qin-polar-run/rust/src/**', 'docs/.vitepress/theme/components/games/qin-polar-run/build-wasm.mjs') }}
      - name: Install cargo-binstall on cache miss
        if: steps.northern-wasm.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@v1.23.0
      - name: Prepare pinned Rust and wasm-bindgen on cache miss
        if: steps.northern-wasm.outputs.cache-hit != 'true'
        working-directory: docs/.vitepress/theme/components/games/qin-polar-run/rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
          rustup show active-toolchain
          # Prebuilt release binary; binstall falls back to `cargo install` if none matches.
          cargo binstall wasm-bindgen-cli@0.2.126 --locked --no-confirm
      # Node stays the runtime (VitePress, node --test); Bun only installs and runs scripts.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check brain-training invariants
        run: bun run brain-training:test
      - name: Check Northern Run loader lifecycle
        run: bun run game:qin-polar-run:test
      - name: Test and build Northern Run on cache miss
        if: steps.northern-wasm.outputs.cache-hit != 'true'
        run: bun run game:qin-polar-run:wasm
      - name: Verify deployable Northern Run assets
        run: |
          test -s docs/public/game-assets/qin-polar-run/wasm/qin_polar_run.js
          test -s docs/public/game-assets/qin-polar-run/wasm/qin_polar_run_bg.wasm
      - name: Build with VitePress
        run: bun run build
      - name: Package Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs/.vitepress/dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
