name: Sync Template Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clean up personal content
        run: node scripts/cleanup-for-template.mjs

      - name: Create Template Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 切换到一个新的孤立分支（不包含 main 的历史记录）或新的分支状态
          # 我们希望将当前的 *纯净* 状态作为 template 分支的最新提交

          # 策略：
          # 直接将变更提交到一个新的临时分支，然后强制推送到远程的 template 分支

          git checkout --orphan template-temp
          git add .
          git commit -m "chore: 同步 main 分支的模板更新 $(date +'%Y-%m-%d')"

          # 强制推送新状态到远程 template 分支
          git push origin template-temp:template --force
